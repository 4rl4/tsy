<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY WORLD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wapper">
        <div class="container">
      <h1>✦ Welcome to My Little World ✦</h1>
       <img 
        src="https://i.pinimg.com/736x/9b/2e/53/9b2e53600d9cd60d64164af0e7d2b172.jpg" 
        alt="avatar"
        class="avatar">

        <div class="song-info">
            <h3 id="song-title">No Song</h3>
            <p id="song-artist">Unknown Artist</p>
        </div>

            <h2>Welcome To My World 🌿</h2>

            <p>
            A little corner filled with memories,
            music and things I love.
            </p>
    
            <div class="window-header">
                <span>🎵mp3_Files</span> 
                <span>✕</span>
            </div>

            <div class="song-title" id="songTitle">
                Now Playing: 
            </div>

            <div class="player-time">
                <span id="currentTime">00:00</span>

                <input type="range" id="progress">

                <span id="duration">00:00</span>
            </div>

            <div class="controls">
                 <button onclick="prevSong()">⏮️</button> 
                 <button onclick="playMusic()">▶️</button> 
                 <button onclick="nextSong()">⏭️</button> 
            </div>

            <audio id="music"></audio>

        <div class="binder-tabs">
            <button><a href="gallery.html">🎨 My Art</a></button>
            <button><a href="edit.html">🎬 My Edit</a></button>
            <button><a href="music.html">🎵 Music </a></button>
            <button><a href="chat.html">💬 Chatting </a></button>
            <button><a href="game.html">🎮 Game </a></button>
        </div>
    </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
